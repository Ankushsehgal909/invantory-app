rootProject.name = 'ShopStock'

def cliPlatformAndroidGradle = file("../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
if (!cliPlatformAndroidGradle.exists()) {
    cliPlatformAndroidGradle = file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
}
apply from: cliPlatformAndroidGradle
applyNativeModulesSettingsGradle(settings)

include ':app'

def gradlePlugin = file("../node_modules/@react-native/gradle-plugin")
if (!gradlePlugin.exists()) {
    gradlePlugin = file("../../node_modules/@react-native/gradle-plugin")
}
includeBuild(gradlePlugin)
